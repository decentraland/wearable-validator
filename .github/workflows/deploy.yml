name: Deploy the run server

# The website deploys itself through Workers; the run server lives on a droplet, so a merge ends here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-run-server
  cancel-in-progress: false

jobs:
  deploy:
    # the droplet deploys from the dcl-regenesislabs repo only; this repo has no droplet secrets
    if: github.repository == 'dcl-regenesislabs/wearable-validator'
    runs-on: ubuntu-latest
    steps:
      - name: Authorize the droplet
        env:
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # the droplet's public host key (ssh-keyscan -t ed25519 <ip>), pinned so a hijacked DNS answer cannot collect the deploy key
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOYbktnQQTNW8fwnSLsg5Tn+oOKktjXv6s0LgSq6zJHa\n' "$HOST" > ~/.ssh/known_hosts

      - name: Pull and rebuild
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@$HOST" '
            set -e
            cd /root/wearable-validator
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            docker compose -f deploy/docker-compose.yml up -d --build
            docker image prune -f >/dev/null
          '

      - name: Wait for it to answer
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          # the port is only exposed inside the compose network, so the container's own healthcheck is the signal
          for i in $(seq 1 30); do
            state=$(ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@$HOST" 'cd /root/wearable-validator && docker inspect --format "{{.State.Health.Status}}" "$(docker compose -f deploy/docker-compose.yml ps -q validator)"' || true)
            if [ "$state" = healthy ]; then
              ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@$HOST" 'cd /root/wearable-validator && docker compose -f deploy/docker-compose.yml exec -T validator wget -qO- http://127.0.0.1:4180/api/health'
              exit 0
            fi
            sleep 10
          done
          echo "the server did not answer after the deploy"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@$HOST" 'cd /root/wearable-validator && docker compose -f deploy/docker-compose.yml logs --tail 40 validator'
          exit 1
