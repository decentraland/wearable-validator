name: Publish the library

# Publishes @dcl-regenesislabs/wearable-validator with oddish, like the other Decentraland packages, through npm's
# trusted publishing (GitHub OIDC): no npm token anywhere. oddish ignores the version in package.json:
#   - a merge to main that touches the library publishes a snapshot on the `next` dist-tag;
#   - a GitHub release tagged with a semver version (e.g. 0.5.0) publishes that version on `latest`.
# The trusted publisher on npmjs.com names this repository and this file (release.yml): keep its name.
on:
  push:
    branches: [main]
    paths: ["packages/wearable-validator/**", ".github/workflows/release.yml"]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-library
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5 or newer; pinned, since this job can mint a publish token
      - run: npm install -g npm@11.20.0
      # no dependency's install script runs while the job holds id-token: write
      - run: npm ci --ignore-scripts
      - run: npm run typecheck -w @dcl-regenesislabs/wearable-validator
      - run: npm test -w @dcl-regenesislabs/wearable-validator
      - run: npm run build -w @dcl-regenesislabs/wearable-validator
      - name: Publish
        uses: decentraland/oddish-action@0074f2d535c43b5c83f136525304a6277166d77f # @master
        with:
          cwd: ./packages/wearable-validator
          registry-url: https://registry.npmjs.org
          access: public
          provenance: true
          deterministic-snapshot: true
